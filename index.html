<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=baccarat.html">
    <title>百家乐 - 加载中...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1810 50%, #1a0a0a 100%);
            font-family: 'Arial', sans-serif;
            color: #ffd700;
        }
        .loading {
            text-align: center;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .loading h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        .loading p {
            font-size: 1.2em;
            opacity: 0.8;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <h1>🎰 百家乐</h1>
        <p>正在加载游戏...</p>
        <p>如果页面没有跳转，<a href="baccarat.html" style="color: #4a9eff;">请点击这里</a></p>
    </div>
</body>
</html>
